<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .gate { flex: 1; display: grid; place-items: center; padding: 48px var(--gutter); }
  .gate-card { width: 100%; max-width: 440px; }
  .gate-lock { width: 52px; height: 52px; border-radius: 14px; background: var(--ink); color: var(--paper); display: grid; place-items: center; margin-bottom: 28px; }
  .gate-lock svg { width: 22px; height: 22px; }
  .gate h1 { margin: 14px 0 12px; }
  .gate p { color: var(--ink-2); }
  .gate form { margin-top: 28px; display: grid; gap: 14px; }
  .gate label.f { font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .gate #pw {
    width: 100%; font: 16px/1.2 var(--f-mono); padding: 15px 16px; border-radius: 12px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  }
  .gate #pw:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .gate .remember { display: flex; gap: 10px; align-items: center; font-size: 14.5px; color: var(--ink-2); }
  .gate .remember input { width: 16px; height: 16px; accent-color: var(--accent); }
  .gate .btn { justify-content: center; width: 100%; padding: 15px 20px; }
  .gate .btn[disabled] { opacity: .6; cursor: progress; transform: none; }
  .gate .err { color: var(--bad); font-size: 14.5px; min-height: 1.4em; margin: 0; }
  .gate .status { color: var(--muted); font-size: 14px; margin: -6px 0 0; min-height: 1.2em; }
  .gate .fine { font-size: 13.5px; color: var(--muted); margin-top: 28px; border-top: 1px solid var(--line); padding-top: 18px; }
</style>

  var STORE = "vx-key-paceline";
  var enc = new TextEncoder();
  var dec = new TextDecoder();
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function b64(buf) { var s = "", a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function deriveKey(password) {
    return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey(

  }
  function decryptWith(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(PAYLOAD.iv) }, key, unb64(PAYLOAD.ct)).then(function (pt) { return dec.decode(pt); });
  }
  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  var form = document.getElementById("gate-form");
  var input = document.getElementById("pw");
  var err = document.getElementById("err");
  var btn = document.getElementById("go");
  var remember = document.getElementById("remember");
  var status = document.getElementById("status");

  function tryPassword(password, keep) {
    btn.disabled = true; err.textContent = ""; btn.firstChild.nodeValue = "Unlocking… ";
    status.textContent = "Unlocking — this can take a few seconds on some phones.";
    return deriveKey(password).then(function (key) {

  var ready = Promise.reject();

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = extractKey(input.value);
    if (pw) { input.value = pw; tryPassword(pw, remember.checked); }
